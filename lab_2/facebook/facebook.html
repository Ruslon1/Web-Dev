<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Facebook — вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="left">
            <img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu2zih0ca.svg" class="logo">
            <p>Facebook помогает вам всегда оставаться на связи и общаться со своими знакомыми.</p>
        </div>

        <div class="right">
            <div class="card">
                <input type="text" placeholder="Электронный адрес или номер телефона">
                <input type="password" placeholder="Пароль">
                <button class="login">Вход</button>
                <a class="forgot">Забыли пароль?</a>
                <div class="line"></div>
                <button class="create">Создать новый аккаунт</button>
            </div>
            <div class="page-link">
                    <p><strong>Создать Страницу</strong> знаменитости, музыкальной группы или компании.</p>
            </div>
        </div>
    </div>
</body>
</html>
