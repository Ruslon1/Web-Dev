<article class="card">
  <div class="gallery">
    @if (galleryImages.length > 1) {
    <button type="button" class="galleryNav prev" (click)="previousImage()" aria-label="Previous image">
      ‹
    </button>
    }

    <a class="imageWrap" [href]="product.link" target="_blank" rel="noopener noreferrer">
      <img [src]="currentImage" [alt]="product.name" loading="lazy" />
    </a>

    @if (galleryImages.length > 1) {
    <button type="button" class="galleryNav next" (click)="nextImage()" aria-label="Next image">
      ›
    </button>
    }
  </div>

  <div class="content">
    <h3 class="name">{{ product.name }}</h3>
    <p class="desc">{{ product.description }}</p>

    <div class="meta">
      <div class="price">{{ product.price | number }} ₸</div>

      <div class="rating" aria-label="Rating">
        @for (star of stars; track star) {
        <span class="star">
          <span class="star-bg">★</span>
          <span class="star-fill" [style.width.%]="starFillPercent(product.rating, star)">★</span>
        </span>
        }
        <span class="ratingNumber">{{ product.rating }}</span>
      </div>
    </div>

    <div class="likes">❤ {{ product.likes }}</div>

    <div class="actions">
      <button type="button" class="btn like" (click)="like()">Like</button>
      <button type="button" class="btn delete" (click)="remove()">Delete</button>
      <a class="btn open" [href]="product.link" target="_blank" rel="noopener noreferrer">Open on Kaspi</a>
    </div>

    <details class="shareMenu">
      <summary class="shareMenuButton">Share</summary>
      <div class="shareMenuList">
        <a class="shareBtn whatsapp" [href]="getWhatsAppShareLink()" target="_blank" rel="noopener noreferrer">
          WhatsApp
        </a>
        <a class="shareBtn telegram" [href]="getTelegramShareLink()" target="_blank" rel="noopener noreferrer">
          Telegram
        </a>
      </div>
    </details>
  </div>
</article>
