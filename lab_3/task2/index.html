<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
</head>

<body>
    <header>
        <h2>ToDo List</h2>
    </header>
    <main>
        <h1>ToDo List</h1>
        <form id="todo-form">

        </form>
        <ul id="todo-list"></ul>
    </main>
</body>

</html>
